<!doctype html>
<!--
  Pins Vercel's static output to exactly this one file.

  With a custom `buildCommand` and no `outputDirectory`, Vercel falls back to
  treating the repository root as the static output and uploads the source tree as
  public assets. Naming `public` in vercel.json keeps the deployment to this page
  plus the function; every other path falls through the rewrite to the API.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pravaah API</title>
  </head>
  <body>
    <h1>Pravaah API</h1>
    <p>Service endpoints live under <code>/api/v1</code>.</p>
  </body>
</html>
